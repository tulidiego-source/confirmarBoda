<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Boda | Bea & Rubén</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="gate">
    <div class="gate__inner">
      <p class="eyebrow">NUESTRA BODA</p>
      <h1 class="couple">Bea <span>&amp;</span> Rubén</h1>
      <p class="gate__text">Por favor, introduce el código de invitación que recibiste</p>
      <form id="gate-form" class="gate__form" autocomplete="off">
        <input type="text" id="code" name="code" placeholder="Código" required />
        <button type="submit">ACCEDER</button>
      </form>
      <p id="gate-error" class="gate__error" hidden>Código incorrecto. Inténtalo de nuevo.</p>
      <p class="gate__hint">Si no tienes un código, contacta con los novios</p>
    </div>
  </section>
  <script>
    const validCodes = ['boda2026', 'invitado'];
    const form = document.getElementById('gate-form');
    const error = document.getElementById('gate-error');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const code = document.getElementById('code').value.trim().toLowerCase();
      if (validCodes.includes(code)) {
        window.location.href = 'info.html';
      } else {
        error.hidden = false;
      }
    });
  </script>
</body>
</html>
