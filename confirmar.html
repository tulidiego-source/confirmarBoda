<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmar asistencia | Bea & Rubén</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="section rsvp">
      <!-- Título y fecha eliminados por solicitud -->
      <div id="google-form-wrap" tabindex="-1" style="width:100%;max-width:700px;margin:0 auto;box-shadow:0 4px 24px #0001;padding:0.5em 0.5em 1.5em 0.5em;background:#fff;border-radius:18px;outline:none;">
        <iframe 
          id="google-form-iframe"
          src="https://docs.google.com/forms/d/e/1FAIpQLSdiR-f_6syd0gQWohXTf3g7wJqX2oPSJ8QzFQWInzUZAyvH7g/viewform?embedded=true"
          width="100%"
          height="2100"
          frameborder="0"
          marginheight="0"
          marginwidth="0"
          style="border:none;display:block;"
          scrolling="auto"
        >Cargando…</iframe>
      </div>
    </section>
  </main>
  <script>
    const formWrap = document.getElementById('google-form-wrap');
    const formIframe = document.getElementById('google-form-iframe');
    let firstLoad = true;

    formIframe.addEventListener('load', function () {
      if (firstLoad) {
        firstLoad = false;
        return;
      }

      // Tras enviar, Google Forms recarga el iframe con la vista de respuesta.
      // Llevamos al usuario arriba del formulario para que vea el mensaje.
      formWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      formWrap.focus({ preventScroll: true });
    });
  </script>
</body>
</html>
